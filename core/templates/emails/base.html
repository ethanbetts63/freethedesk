<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Free the Desk{% endblock %}</title>
    <style>
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        table { border-collapse: collapse !important; }
        body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; background-color: #f4f5f2; }
    </style>
</head>
<body style="background-color: #f4f5f2; margin: 0 !important; padding: 0 !important;">

    <div style="display: none; max-height: 0; overflow: hidden; font-size: 1px; color: #f4f5f2;">
        {% block preheader %}{% endblock %}
    </div>

    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f4f5f2;">
        <tr>
            <td align="center" style="padding: 40px 20px;">
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 560px;">

                    <tr>
                        <td align="center" style="background-color: #16201a; padding: 30px 40px; border-radius: 6px 6px 0 0;">
                            <a href="{{ site_url }}" target="_blank" style="text-decoration: none; font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: #ffffff;">
                                free<span style="color: #c9f45b;">the</span>desk<span style="color: #c9f45b;">.</span>
                            </a>
                        </td>
                    </tr>

                    <tr>
                        <td style="background-color: #ffffff; padding: 40px; font-family: Arial, Helvetica, sans-serif; font-size: 15px; color: #1c1917; line-height: 26px; border-radius: 0 0 6px 6px;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>

                    <tr>
                        <td align="center" style="padding-top: 24px; font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #78716c; line-height: 18px;">
                            <a href="{{ site_url }}" target="_blank" style="color: #78716c; text-decoration: none;">freethedesk.com.au</a>
                            &nbsp;&middot;&nbsp;
                            Perth, Western Australia
                            {% block unsubscribe %}{% endblock %}
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>

</body>
</html>
