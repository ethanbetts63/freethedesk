<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}freethedesk{% endblock %}</title>
    <style>
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        table { border-collapse: collapse !important; }
        body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; background-color: #eaedf1; }
    </style>
</head>
<body style="background-color: #eaedf1; margin: 0 !important; padding: 0 !important;">

    <div style="display: none; max-height: 0; overflow: hidden; font-size: 1px; color: #eaedf1;">
        {% block preheader %}{% endblock %}
    </div>

    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #eaedf1;">
        <tr>
            <td align="center" style="padding: 28px 12px;">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; background-color: #ffffff;">

                    <!-- header: the logo and wordmark as the site sets them -->
                    <tr>
                        <td align="center" style="text-align: center; padding: 18px 32px; border-bottom: 1px solid #d3dbe4; font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 900; letter-spacing: -1.8px; color: #000000;">
                            <a href="{{ site_url }}" target="_blank" style="text-decoration: none; color: #000000;"><img src="{{ site_url }}/logo-mark.png" width="28" height="28" alt="" style="display: inline-block; width: 28px; height: 28px; vertical-align: middle; margin-right: 6px;"><span style="vertical-align: middle;">free<span style="color: #1a5fa8;">the</span>desk<span style="color: #2473c6;">.</span></span></a>
                        </td>
                    </tr>

                    <tr>
                        <td style="background-color: #ffffff; padding: 32px; font-family: Arial, Helvetica, sans-serif; font-size: 15px; color: #09121b; line-height: 26px;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>

                    <!-- footer: the same logo, with the place and the page's own line beneath -->
                    <tr>
                        <td align="center" style="text-align: center; padding: 20px 32px 22px; border-top: 1px solid #d3dbe4; font-family: Arial, Helvetica, sans-serif; font-size: 11px; line-height: 17px; color: #97a8ba;">
                            <div style="margin: 0 0 8px; font-size: 22px; font-weight: 900; letter-spacing: -1.8px; line-height: 28px; color: #000000;"><a href="{{ site_url }}" target="_blank" style="text-decoration: none; color: #000000;"><img src="{{ site_url }}/logo-mark.png" width="28" height="28" alt="" style="display: inline-block; width: 28px; height: 28px; vertical-align: middle; margin-right: 6px;"><span style="vertical-align: middle;">free<span style="color: #1a5fa8;">the</span>desk<span style="color: #2473c6;">.</span></span></a></div>
                            Perth, Western Australia
                            {% block unsubscribe %}{% endblock %}
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>

</body>
</html>
