# Security gate — freethedesk
#
# The gate described in ../freetheplatform/_docs/security-standard.md §18, run
# against this product's real settings. `manage.py check --deploy` is one
# command covering three of the four things listed there: Django's own
# deployment warnings, freetheplatform's system checks (cookies, TLS, the
# unrouted admin, the authentication classes, the throttle cache), and the
# route-coverage check that refuses a route with no throttle scope.
#
# No database is needed. System checks read settings and the URLconf; none of
# them opens a connection, which is why this runs in a minute and needs no
# MySQL service.
#
# ADVISORY UNTIL 2026-10-03. Delete the `continue-on-error` lines that name that
# date, and this paragraph, and the gate starts blocking. pip-audit stays
# advisory permanently — you do not choose when a CVE is published.

name: Security gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Django deployment checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      # mysqlclient builds from source and needs the client library headers.
      - name: MySQL client headers
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev

      # freetheplatform is a **private** repository, so the lockfile's
      # `git+https://github.com/...` line cannot be cloned by an anonymous
      # runner. `actions/checkout` hands out a token for *this* repository only.
      #
      # FREETHEPLATFORM_TOKEN is a fine-grained personal access token with
      # read-only Contents access to ethanbetts63/freetheplatform, stored as a
      # repository secret. Without it the install fails with a 404 that reads
      # like a missing tag rather than a missing credential.
      - name: Authenticate to freetheplatform
        run: |
          git config --global url."https://x-access-token:${{ secrets.FREETHEPLATFORM_TOKEN }}@github.com/".insteadOf "https://github.com/"

      # The lockfile, not requirements.in — the point is to check what the
      # server would install. It resolves freetheplatform from its git tag.
      - run: python -m pip install -r requirements.txt

      - name: manage.py check --deploy
        continue-on-error: true # advisory until 2026-10-03
        env:
          # DEBUG is deliberately unset: settings default it to production, and
          # every check here is a no-op under DEBUG.
          #
          # These are throwaway values, not the production secrets. Settings
          # refuses to start without them, and nothing in a system check calls
          # Stripe. SECRET_KEY is generated long and random because Django's
          # security.W009 fires on a short one, and a warning that is an
          # artefact of CI is one people learn to scroll past.
          STRIPE_SECRET_KEY: sk_test_ci_not_a_real_key
          STRIPE_WEBHOOK_SECRET: whsec_ci_not_a_real_secret
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          python manage.py check --deploy

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: MySQL client headers
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev

      # freetheplatform is a **private** repository, so the lockfile's
      # `git+https://github.com/...` line cannot be cloned by an anonymous
      # runner. `actions/checkout` hands out a token for *this* repository only.
      #
      # FREETHEPLATFORM_TOKEN is a fine-grained personal access token with
      # read-only Contents access to ethanbetts63/freetheplatform, stored as a
      # repository secret. Without it the install fails with a 404 that reads
      # like a missing tag rather than a missing credential.
      - name: Authenticate to freetheplatform
        run: |
          git config --global url."https://x-access-token:${{ secrets.FREETHEPLATFORM_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - run: python -m pip install -r requirements.txt pip-audit

      # Advisory permanently — see the header. freetheplatform is installed from
      # git rather than PyPI, so pip-audit reports it as unauditable and skips
      # it; its own dependencies are resolved into this lockfile and are covered.
      - name: pip-audit
        continue-on-error: true
        run: pip-audit
